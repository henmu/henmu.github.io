<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & CV</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #667eea;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #764ba2;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .contact-item label {
            font-weight: 600;
            min-width: 100px;
            color: #555;
        }

        .contact-item a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-item a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .button {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
            text-align: center;
        }

        .button:hover {
            background: #764ba2;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact & Information</h1>

        <div class="section">
            <h2>Get in Touch</h2>
            <div class="contact-item">
                <label>Email:</label>
                <a href="mailto:your.email@example.com">your.email@example.com</a>
            </div>
        </div>

        <div class="section">
            <h2>Social Links</h2>
            <div class="contact-item">
                <label>LinkedIn:</label>
                <a href="https://linkedin.com/in/henmu" target="_blank">linkedin.com/in/yourprofile</a>
            </div>
            <div class="contact-item">
                <label>GitHub:</label>
                <a href="https://github.com/henmu" target="_blank">github.com/henmu</a>
            </div>
        </div>
    </div>
</body>
</html>
